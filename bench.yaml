# Stufe A — reiner Hardware-Test, Heizung NICHT angeschlossen.
# Zweck: IR-LED blinkt sichtbar (Handykamera), Fototransistor liefert Bytes (TV-Fernbedienung).
substitutions:
  name: optolink-bench

esphome:
  name: ${name}
  friendly_name: Optolink Bench

esp8266:
  board: d1_mini

# PFLICHT: UART0 gehoert der Optolink-Leitung (8E2 @ 4800).
# Ohne baud_rate: 0 belegt der Logger GPIO1 mit 115200 8N1.
logger:
  baud_rate: 0
  level: DEBUG

api:
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "optolink-fallback"

uart:
  - id: opto
    tx_pin: GPIO1
    rx_pin: GPIO3
    baud_rate: 4800
    data_bits: 8
    parity: EVEN
    stop_bits: 2
    debug:
      direction: BOTH
      dummy_receiver: true      # kein echter Consumer im Bench-Betrieb
      after:
        timeout: 20ms
      sequence:
        - lambda: UARTDebug::log_hex(direction, bytes, ':');

# 64 Byte am Stueck = ~130 ms Dauerlicht: mit Handykamera klar sichtbar.
interval:
  - interval: 2s
    then:
      - uart.write: !lambda |-
          return std::vector<uint8_t>(64, 0x55);
