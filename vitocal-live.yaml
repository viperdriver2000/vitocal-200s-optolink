# Vitocal 200-S, CU401B_S (WO1C), FW 0x41 - nur LESEN.
# Adressen siehe docs/adressen-cu401b-sw41.md
substitutions:
  name: optolink-bench

esphome:
  name: ${name}
  friendly_name: Vitocal Optolink

esp8266:
  board: d1_mini

logger:
  baud_rate: 0
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "optolink-fallback"

external_components:
  - source: github://dannerph/esphome_vitoconnect

uart:
  - id: opto
    tx_pin: GPIO1
    rx_pin: GPIO3
    baud_rate: 4800
    data_bits: 8
    parity: EVEN
    stop_bits: 2

vitoconnect:
  uart_id: opto
  protocol: P300
  update_interval: 30s

sensor:
  - platform: vitoconnect
    name: "Aussentemperatur"
    address: 0x0880
    length: 2
    accuracy_decimals: 1
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    filters:
      - lambda: return x * 0.1;
  - platform: vitoconnect
    name: "Warmwasser"
    address: 0x0882
    length: 2
    accuracy_decimals: 1
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    filters:
      - lambda: return x * 0.1;
  - platform: vitoconnect
    name: "Heissgas"
    address: 0x0893
    length: 2
    accuracy_decimals: 1
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    filters:
      - lambda: return x * 0.1;
  - platform: vitoconnect
    name: "Kesseltemperatur"
    address: 0xA309
    length: 2
    accuracy_decimals: 2
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    filters:
      - lambda: return x * 0.01;
  - platform: vitoconnect
    name: "Anlagenvorlauf Ist"
    address: 0xA393
    length: 2
    accuracy_decimals: 2
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    filters:
      - lambda: return x * 0.01;
  - platform: vitoconnect
    name: "Kessellsolltemperatur"
    address: 0xA307
    length: 2
    accuracy_decimals: 2
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    filters:
      - lambda: return x * 0.01;
  - platform: vitoconnect
    name: "Vorlauf Sekundaer Mittel"
    address: 0x16B2
    length: 2
    accuracy_decimals: 1
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    filters:
      - lambda: return x * 0.1;
  - platform: vitoconnect
    name: "Ruecklauf Sekundaer Mittel"
    address: 0x16B3
    length: 2
    accuracy_decimals: 1
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    filters:
      - lambda: return x * 0.1;
  - platform: vitoconnect
    name: "Vorlauf Soll HK1"
    address: 0x1800
    length: 2
    accuracy_decimals: 1
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    filters:
      - lambda: return x * 0.1;
  - platform: vitoconnect
    name: "COP Verdichter"
    address: 0x1690
    length: 2
    accuracy_decimals: 1
    state_class: measurement
    filters:
      - lambda: return x * 0.1;
  - platform: vitoconnect
    name: "Drehzahl Primaerquelle"
    address: 0xB420
    length: 2
    accuracy_decimals: 1
    unit_of_measurement: "%"
    state_class: measurement
    filters:
      - lambda: return x * 1.0;
  - platform: vitoconnect
    name: "Timer Abtauung"
    address: 0x1375
    length: 2
    accuracy_decimals: 1
    unit_of_measurement: "s"
    device_class: duration
    state_class: measurement
    filters:
      - lambda: return x * 1.0;
  - platform: vitoconnect
    name: "Verdichterstunden"
    address: 0x0580
    length: 4
    unit_of_measurement: "h"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 1
    filters:
      - lambda: return x / 3600.0;

  # Rohwerte der Status-Bits (maskiert, Auswertung in Home Assistant)
  # 0x0491: bit_mask 1 = Sammelstoerung, bit_mask 64 = RelaisStatus
  # 0x03D8: bit_mask 1 = Stoerung Folge-WP
  - platform: vitoconnect
    name: "Status Sammelstoerung Roh"
    address: 0x0491
    length: 2
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      - lambda: return ((int) x & 0xFF);

  - platform: vitoconnect
    name: "Status FolgeWP Roh"
    address: 0x03D8
    length: 2
    accuracy_decimals: 0
    entity_category: diagnostic
    filters:
      - lambda: return ((int) x & 0xFF);
