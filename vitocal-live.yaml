substitutions:
  name: optolink-bench

esphome:
  name: ${name}
  friendly_name: Vitocal Optolink

esp8266:
  board: d1_mini

logger:
  baud_rate: 0
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "optolink-fallback"

external_components:
  - source: github://dannerph/esphome_vitoconnect

uart:
  - id: opto
    tx_pin: GPIO1
    rx_pin: GPIO3
    baud_rate: 4800
    data_bits: 8
    parity: EVEN
    stop_bits: 2

vitoconnect:
  uart_id: opto
  protocol: P300
  update_interval: 30s

sensor:
  - platform: vitoconnect
    name: "Aussentemperatur"
    address: 0x0880
    length: 2
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: return x * 0.1;
  - platform: vitoconnect
    name: "Warmwasser"
    address: 0x0882
    length: 2
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: return x * 0.1;
  - platform: vitoconnect
    name: "Vorlauf Primaer"
    address: 0x088F
    length: 2
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: return x * 0.1;
  - platform: vitoconnect
    name: "Vorlauf Sekundaer"
    address: 0x0890
    length: 2
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: return x * 0.1;
  - platform: vitoconnect
    name: "Ruecklauf"
    address: 0x0891
    length: 2
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: return x * 0.1;
  - platform: vitoconnect
    name: "Heissgas"
    address: 0x0893
    length: 2
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: return x * 0.1;
  - platform: vitoconnect
    name: "Ruecklauf 2"
    address: 0x0894
    length: 2
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1
    filters:
      - lambda: return x * 0.1;
  - platform: vitoconnect
    name: "Druck Kaeltemittel"
    address: 0x088E
    length: 2
    unit_of_measurement: "bar"
    accuracy_decimals: 1
    filters:
      - lambda: return x * 0.1;
