# Alternative fuer ESP32 mit esphome_vitohome (GPL-3.0, wird nur per git referenziert).
# Kann LESEN und SCHREIBEN (number/select/switch/climate).
# Achtung: Schreibzugriffe gehen auf EEPROM-Zellen - nur bei echter Aenderung schreiben.
#
# Board/Pins anpassen. Beispiel nutzt einen generischen ESP32 (WROOM).
substitutions:
  name: vitocal-vitohome

esphome:
  name: ${name}
  friendly_name: Vitocal Optolink

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:
  level: DEBUG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "vitocal-fallback"

external_components:
  - source:
      type: git
      url: https://github.com/SoulSolistice/esphome_vitohome
      ref: main
    components: [vitohome]

# 4800 8E2 ist Pflicht. Pins je nach Board anpassen.
uart:
  - id: opto
    rx_pin: GPIO05
    tx_pin: GPIO02
    baud_rate: 4800
    data_bits: 8
    parity: EVEN
    stop_bits: 2

vitohome:
  id: vito
  uart_id: opto
  protocol: P300
  update_interval: 60s

# Adressen empirisch ermittelt, siehe docs/adressen-cu401b-sw41.md
sensor:
  - platform: vitohome
    name: "Aussentemperatur"
    address: 0x0880
    length: 2
    converter: div10
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: vitohome
    name: "Warmwasser"
    address: 0x0882
    length: 2
    converter: div10
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: vitohome
    name: "Vorlauf Primaer"
    address: 0x088F
    length: 2
    converter: div10
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: vitohome
    name: "Vorlauf Sekundaer"
    address: 0x0890
    length: 2
    converter: div10
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: vitohome
    name: "Ruecklauf"
    address: 0x0891
    length: 2
    converter: div10
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: vitohome
    name: "Heissgas"
    address: 0x0893
    length: 2
    converter: div10
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: vitohome
    name: "Ruecklauf 2"
    address: 0x0894
    length: 2
    converter: div10
    unit_of_measurement: "C"
    device_class: temperature
    state_class: measurement
    accuracy_decimals: 1

  - platform: vitohome
    name: "Verdichterstunden"
    address: 0x0580
    length: 4
    converter: noconv
    unit_of_measurement: "s"
    device_class: duration
    state_class: total_increasing
    accuracy_decimals: 0
