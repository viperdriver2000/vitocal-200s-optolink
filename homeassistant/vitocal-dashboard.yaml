# Lovelace-View fuer die Vitocal-Sensoren (ESPHome-Geraet "Vitocal Optolink").
# Einbau: Dashboard -> Bearbeiten -> Raw Configuration Editor, unter views: einfuegen.
title: Heizung
path: heizung
icon: mdi:heat-pump
cards:
  - type: gauge
    entity: sensor.vitocal_optolink_aussentemperatur
    name: Aussen
    min: -20
    max: 35
    severity:
      green: 0
      yellow: -10
      red: -20

  - type: gauge
    entity: sensor.vitocal_optolink_cop_verdichter
    name: COP
    min: 0
    max: 6
    severity:
      red: 2
      yellow: 3
      green: 4

  - type: entities
    title: Temperaturen
    entities:
      - entity: sensor.vitocal_optolink_aussentemperatur
      - entity: sensor.vitocal_optolink_warmwasser
      - entity: sensor.vitocal_optolink_kesseltemperatur
      - entity: sensor.vitocal_optolink_anlagenvorlauf_ist
      - entity: sensor.vitocal_optolink_kessellsolltemperatur
      - entity: sensor.vitocal_optolink_vorlauf_sekundaer_mittel
      - entity: sensor.vitocal_optolink_ruecklauf_sekundaer_mittel
      - entity: sensor.vitocal_optolink_vorlauf_soll_hk1
      - entity: sensor.vitocal_optolink_heissgas

  - type: entities
    title: Betrieb
    entities:
      - entity: sensor.vitocal_optolink_cop_verdichter
      - entity: sensor.vitocal_optolink_drehzahl_primaerquelle
      - entity: sensor.vitocal_optolink_timer_abtauung
      - entity: sensor.vitocal_optolink_verdichterstunden

  - type: history-graph
    title: Temperaturen 24 h
    hours_to_show: 24
    entities:
      - entity: sensor.vitocal_optolink_aussentemperatur
      - entity: sensor.vitocal_optolink_anlagenvorlauf_ist
      - entity: sensor.vitocal_optolink_ruecklauf_sekundaer_mittel
      - entity: sensor.vitocal_optolink_warmwasser

  - type: history-graph
    title: COP und Heissgas 24 h
    hours_to_show: 24
    entities:
      - entity: sensor.vitocal_optolink_cop_verdichter
      - entity: sensor.vitocal_optolink_heissgas

  - type: statistics-graph
    title: Verdichterstunden pro Tag
    chart_type: bar
    period: day
    days_to_show: 7
    entities:
      - entity: sensor.vitocal_optolink_verdichterstunden
