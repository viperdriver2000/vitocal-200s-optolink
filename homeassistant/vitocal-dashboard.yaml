# Lovelace-View fuer die Vitocal-Sensoren (ESPHome-Geraet "Vitocal Optolink").
# Einfuegen ueber: Dashboard -> Bearbeiten -> Raw Configuration Editor.
#
# Entity-IDs ggf. anpassen (Einstellungen -> Geraete -> Vitocal Optolink).
title: Heizung
path: heizung
icon: mdi:heat-pump
cards:
  - type: gauge
    entity: sensor.vitocal_optolink_aussentemperatur
    name: Aussen
    min: -20
    max: 35
    severity:
      green: 0
      yellow: -10
      red: -20

  - type: entities
    title: Temperaturen
    entities:
      - entity: sensor.vitocal_optolink_aussentemperatur
        name: Aussentemperatur
      - entity: sensor.vitocal_optolink_warmwasser
        name: Warmwasser
      - entity: sensor.vitocal_optolink_vorlauf_primaer
        name: Vorlauf primaer
      - entity: sensor.vitocal_optolink_vorlauf_sekundaer
        name: Vorlauf sekundaer
      - entity: sensor.vitocal_optolink_ruecklauf
        name: Ruecklauf
      - entity: sensor.vitocal_optolink_ruecklauf_2
        name: Ruecklauf 2
      - entity: sensor.vitocal_optolink_heissgas
        name: Heissgas
      - entity: sensor.vitocal_optolink_druck_kaeltemittel
        name: Kaeltemitteldruck

  - type: history-graph
    title: Verlauf 24 h
    hours_to_show: 24
    entities:
      - entity: sensor.vitocal_optolink_aussentemperatur
      - entity: sensor.vitocal_optolink_vorlauf_sekundaer
      - entity: sensor.vitocal_optolink_ruecklauf
      - entity: sensor.vitocal_optolink_warmwasser

  - type: history-graph
    title: Heissgas und Kaeltemitteldruck
    hours_to_show: 24
    entities:
      - entity: sensor.vitocal_optolink_heissgas
      - entity: sensor.vitocal_optolink_druck_kaeltemittel

  - type: statistics-graph
    title: Verdichterstunden pro Tag
    chart_type: bar
    period: day
    days_to_show: 7
    entities:
      - entity: sensor.vitocal_optolink_verdichterstunden
